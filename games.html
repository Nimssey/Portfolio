<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="description" content="Games by Nimssey, Project Lead at Structa Games. Live CCU, visits, and Roblox experiences.">
	<meta name="theme-color" content="#0b0b0d">
	<title>Games — Nimssey</title>
	<link rel="icon" type="image/png" href="assets/favicon.png?v=2">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="css/style.css?v=12">
	<script>
		(function () {
			var saved = localStorage.getItem("nimssey-theme");
			var theme = saved === "light" || saved === "dark"
				? saved
				: (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
			document.documentElement.setAttribute("data-theme", theme);
		})();
	</script>
</head>
<body>
	<div class="bg-fx" aria-hidden="true"></div>
	<a class="skip" href="#content">Skip to content</a>
	<header class="site-header">
		<div class="nav-inner">
			<a class="brand" href="index.html">Nimssey</a>
			<div class="nav-end">
			<nav id="nav-panel" class="nav-links" data-nav-panel aria-label="Primary">
				<a href="index.html">Home</a>
				<a class="is-active" href="games.html">Games</a>
			</nav>
			<div class="nav-actions">
				<button class="icon-btn" type="button" data-theme-toggle aria-pressed="false" aria-label="Switch theme">
					<svg viewBox="0 0 24 24" aria-hidden="true">
						<circle cx="12" cy="12" r="4"/>
						<path d="M12 3v2M12 19v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M3 12h2M19 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
					</svg>
				</button>
				<button class="icon-btn nav-toggle" type="button" data-nav-toggle aria-expanded="false" aria-controls="nav-panel" aria-label="Open menu">
					<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
				</button>
			</div>
			</div>
		</div>
	</header>

	<main id="content" class="wrap">
		<header class="page-head">
			<h1 class="name-display">Games</h1>
			<p>Live player counts across every experience.</p>
		</header>

		<section class="totals" data-totals aria-live="polite">
			<article class="stat-card">
				<span><i class="pulse" aria-hidden="true"></i> Current CCU</span>
				<strong class="skeleton">0000</strong>
				<p class="status" data-status>Loading live stats…</p>
			</article>
			<article class="stat-card">
				<span>Peak CCU</span>
				<strong class="skeleton">0000</strong>
			</article>
		</section>

		<section class="games-list" data-games>
			<a class="game-card" href="https://www.roblox.com/games/125977609033603/Evolve-Survive" target="_blank" rel="noreferrer">
				<div class="game-media">
					<img src="https://tr.rbxcdn.com/180DAY-606831c1f057268f8fb6b6f1ffe794f9/768/432/Image/Png/noFilter" alt="">
					<img class="game-icon" src="https://tr.rbxcdn.com/180DAY-2db78b7fbb9f08bea938ee54a255bf1f/150/150/Image/Png/noFilter" alt="">
				</div>
				<div class="game-body">
					<h2>Evolve &amp; Survive</h2>
					<div class="game-meta">
						<div class="game-stats">
							<span>CCU <b class="ccu-off">—</b></span>
							<span>Visits <b>—</b></span>
						</div>
						<time class="game-released" datetime="2026-07-15">Jul 15, 2026</time>
					</div>
				</div>
			</a>
		</section>
	</main>
	<script src="js/config.js?v=3"></script>
	<script src="js/site.js?v=5"></script>
	<script src="js/games.js?v=6"></script>
</body>
</html>
